name: build-kernel-size

# OnePlus 6T (fajita / SDM845) —— 内核体积边界判定实验
#
# 已验证的事实（2026-11-08 实机）：
#   * 原厂内核 + 原厂 ramdisk，用本仓库外部工具 mkbootimg.py 重打包 → 安卓正常启动
#     ⇒ 打包链 / header v1 / 地址 / os_version / vbmeta 全部没问题
#   * 原厂内核 + AGNOS 的 sdm845-oneplus6t.dtb → 安卓正常启动
#     ⇒ 我们的 DTB 合法，ABL 也接受
#   * arm64 Image 头逐字段一致（text_offset=0x80000, flags=0xa, magic=ARMd）
#     唯一差异：image_size = 55.20 MiB（原厂 34.55 / TWRP 37.13 都能启动）
#
# 因此本 workflow 同时产出两个镜像，把「体积」这个唯一剩余变量钉死：
#
#   probe   诊断探针：尽量小（去掉相机/音频/GPU/无线/调试），只回答
#           「一个明显更小的内核能不能被 6T 启动」。★ 测完即废弃，不作交付。
#
#   fullopt 全功能优化：camera / audio / GPU 全部保留，只做 -Os
#           + 去掉纯调试项（KALLSYMS_ALL / DEBUG_KERNEL / SLUB_DEBUG /
#           *_EVTLOG_DEBUG / MSM_RTB 等），尽量把 image_size 压低。
#
# 两者都开 FRAMEBUFFER_CONSOLE + PANIC_TIMEOUT=0，失败时屏幕上能看到 printk。
#
# 产物：6T-kernel-<variant>-<ref>，含 Image/Image.gz-dtb/dtb/kernel.config/summary.txt

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'agnos-kernel-sdm845 分支'
        required: false
        default: 'master'
      jobs:
        description: 'make -j'
        required: false
        default: '4'

permissions:
  contents: read

env:
  KERNEL_REPO: 'https://github.com/commaai/agnos-kernel-sdm845.git'
  DEFCONFIG: 'fajita_defconfig'
  DT_NAME: 'sdm845-oneplus6t'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [probe, fullopt]

    steps:
      - name: Checkout (this repo, 含 dts/defconfig)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu device-tree-compiler \
            python3 cpio rsync xz-utils make
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2
          aarch64-linux-gnu-gcc --version | head -1
          dtc --version

      - name: Fetch kernel source (shallow)
        run: |
          REF="${{ inputs.kernel_ref || 'master' }}"
          git clone --depth 1 --single-branch --branch "$REF" "$KERNEL_REPO" kernel
          echo "kernel commit: $(git -C kernel rev-parse HEAD)"

      - name: Install 6T board support
        run: |
          set -euo pipefail
          cp "dts/${DT_NAME}.dts" kernel/arch/arm64/boot/dts/qcom/
          DTS_MAKE=kernel/arch/arm64/boot/dts/qcom/Makefile
          grep -q "${DT_NAME}.dtb" "$DTS_MAKE" || \
            echo "dtb-\$(CONFIG_ARCH_QCOM) += ${DT_NAME}.dtb" >> "$DTS_MAKE"
          cp "defconfig/${DEFCONFIG}" kernel/arch/arm64/configs/
          sed -i 's|^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES=.*|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="qcom/sdm845-oneplus6t"|' \
            "kernel/arch/arm64/configs/${DEFCONFIG}"
          grep APPENDED "kernel/arch/arm64/configs/${DEFCONFIG}"

      - name: Patch py2 scripts for py3
        run: |
          set -euo pipefail
          cd kernel
          python3 - <<'PYEOF'
          from pathlib import Path
          wrapper = r"""#!/usr/bin/env python3
          import os, subprocess, sys
          if os.environ.get("ALLOW_WERROR_SPAM"):
              sys.exit(subprocess.call(sys.argv[1:]))
          p = subprocess.Popen(sys.argv[1:], stdout=subprocess.PIPE,
                               stderr=subprocess.PIPE, universal_newlines=True)
          out, err = p.communicate()
          sys.stdout.write(out); sys.stderr.write(err)
          sys.exit(p.returncode)
          """
          Path("scripts/gcc-wrapper.py").write_text(wrapper)
          Path("scripts/gcc-wrapper.py").chmod(0o755)
          PYEOF
          python3 -m py_compile scripts/gcc-wrapper.py && echo "gcc-wrapper.py OK"

      - name: Verify Qualcomm clk headers (never overwrite)
        run: |
          set -euo pipefail
          cd kernel
          # 2026-11-08 教训：曾经 cat > 覆盖 msm-clk.h，抹掉 CLKFLAG_*，导致
          # camera_v2/isp/msm_isp48.c 编译失败。这棵树自带完整头，必须原样保留。
          test -f include/linux/clk/msm-clk.h
          for f in CLKFLAG_NORETAIN_MEM CLKFLAG_NORETAIN_PERIPH CLKFLAG_RETAIN_MEM; do
            grep -q "$f" include/linux/clk/msm-clk.h || { echo "缺 $f"; exit 1; }
          done
          echo "msm-clk.h 完整"

      - name: Configure (${{ matrix.variant }})
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make O=out-${{ matrix.variant }} "$DEFCONFIG" 2>&1 | tail -5
          SC="scripts/config --file out-${{ matrix.variant }}/.config"

          # 两个变体都要：屏幕日志 + panic 不重启 + 不签模块
          $SC -e FRAMEBUFFER_CONSOLE -e FRAMEBUFFER_CONSOLE_DETECT_PRIMARY \
              -e VT -e VT_CONSOLE -e FB -e DRM_FBDEV_EMULATION || true
          $SC --set-val PANIC_TIMEOUT 0 || true
          $SC -d MODULE_SIG -d MODULE_SIG_ALL -d MODULE_SIG_FORCE \
              -d SYSTEM_TRUSTED_KEYS -d SYSTEM_REVOCATION_KEYS || true

          if [ "${{ matrix.variant }}" = "probe" ]; then
            echo "=== probe：激进瘦身，仅用于判定体积边界（不作交付）==="
            # ★ 教训 2026-11-08：不要关 CONFIG_WLAN。它会让 WIRELESS_EXT 的结构体成员消失，
            #   而 drivers/staging/qcacld-3.0 仍以 QCA_CLD_WLAN=y 参与编译，直接编译失败：
            #     error: 'struct net_device' has no member named 'wireless_handlers'
            #   要瘦无线，就精确关掉 QCA_CLD_WLAN 本身（它是体积大户）。
            $SC -d QCA_CLD_WLAN \
                -d MSMB_CAMERA -d MSM_CAMERA_SENSOR \
                -d QCOM_KGSL -d QCOM_KGSL_IOMMU \
                -d SND_SOC -d SOUND \
                -d NFC_NQ \
                -d KALLSYMS_ALL -d DEBUG_KERNEL -d SLUB_DEBUG \
                -d PROFILING -d PSTORE_FTRACE \
                -d DRM_SDE_EVTLOG_DEBUG -d MSM_SDE_ROTATOR_EVTLOG_DEBUG \
                -d MSM_GLADIATOR_HANG_DETECT \
                -d MSM_RTB -d MSM_RTB_SEPARATE \
                -d CGROUP_DEBUG -d SCSI_DEBUG \
                -d F2FS_FS -d NTFS_FS -d XFS_FS -d ISO9660_FS -d UDF_FS \
                -d NFS_FS -d CIFS -d 9P_FS -d HFS_FS -d JFS_FS \
                -e CC_OPTIMIZE_FOR_SIZE -d CC_OPTIMIZE_FOR_PERFORMANCE || true
          else
            echo "=== fullopt：功能全留，只做 -Os + 去调试 ==="
            $SC -d KALLSYMS_ALL \
                -d DEBUG_KERNEL -d SLUB_DEBUG -d PROFILING \
                -d PSTORE_FTRACE \
                -d DRM_SDE_EVTLOG_DEBUG -d MSM_SDE_ROTATOR_EVTLOG_DEBUG \
                -d MSM_GLADIATOR_HANG_DETECT \
                -d MSM_RTB -d MSM_RTB_SEPARATE \
                -d CGROUP_DEBUG -d SCSI_DEBUG \
                -e CC_OPTIMIZE_FOR_SIZE -d CC_OPTIMIZE_FOR_PERFORMANCE || true
          fi

          make O=out-${{ matrix.variant }} olddefconfig
          echo "=== 关键配置 ==="
          grep -E "^CONFIG_(MSMB_CAMERA|MSM_CAMERA_SENSOR|SND_SOC|QCOM_KGSL|FRAMEBUFFER_CONSOLE|CC_OPTIMIZE_FOR_SIZE|KALLSYMS_ALL|PANIC_TIMEOUT)=" \
            out-${{ matrix.variant }}/.config || true

      - name: Build dtb (fail fast)
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" WERROR=0
          make O=out-${{ matrix.variant }} -j"${{ inputs.jobs || '4' }}" \
            "qcom/${DT_NAME}.dtb" 2>&1 | tail -10

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" WERROR=0
          set -o pipefail
          make O=out-${{ matrix.variant }} -j"${{ inputs.jobs || '4' }}" Image.gz-dtb \
            > /tmp/kbuild-${{ matrix.variant }}.log 2>&1 || {
            echo "=== BUILD FAILED (${{ matrix.variant }}) ==="
            grep -nE 'error:|\*\*\*|No rule|undefined reference|fatal' \
              /tmp/kbuild-${{ matrix.variant }}.log | tail -25
            tail -25 /tmp/kbuild-${{ matrix.variant }}.log
            exit 1
          }
          tail -5 /tmp/kbuild-${{ matrix.variant }}.log

      - name: Report image_size (关键指标)
        run: |
          set -uo pipefail
          K=kernel/out-${{ matrix.variant }}/arch/arm64/boot
          mkdir -p dist
          python3 - "$K/Image" "${{ matrix.variant }}" <<'PY' | tee dist/summary.txt
          import struct, sys, os
          img, variant = sys.argv[1], sys.argv[2]
          raw = open(img, 'rb').read()
          text_off, image_size, flags = struct.unpack_from('<QQQ', raw, 8)
          print(f"variant        : {variant}")
          print(f"Image 文件大小 : {len(raw)/1048576:.2f} MiB")
          print(f"image_size     : {image_size/1048576:.2f} MiB   <-- ABL 关心的字段")
          print(f"text_offset    : {text_off:#x}")
          print(f"flags          : {flags:#x}")
          print(f"magic          : {raw[56:60].decode('latin1')}")
          print(f"参考           : 原厂 34.55 MiB（能启动） / TWRP 37.13 MiB（能启动）")
          print(f"                  AGNOS 旧 55.20 MiB（不能启动）")
          PY

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          K=kernel/out-${{ matrix.variant }}/arch/arm64/boot
          for f in Image Image.gz Image-dtb Image.gz-dtb; do
            [ -f "$K/$f" ] && cp "$K/$f" dist/ || true
          done
          [ -f "$K/dts/qcom/${DT_NAME}.dtb" ] && cp "$K/dts/qcom/${DT_NAME}.dtb" dist/
          cp kernel/out-${{ matrix.variant }}/.config dist/kernel.config 2>/dev/null || true
          ls -lh dist/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 6T-kernel-${{ matrix.variant }}-${{ inputs.kernel_ref || 'master' }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}
          path: |
            kernel/out-${{ matrix.variant }}/.config
            /tmp/kbuild-${{ matrix.variant }}.log
          if-no-files-found: ignore
          retention-days: 7