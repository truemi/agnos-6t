name: build-kernel-console

# OnePlus 6T (fajita / SDM845) AGNOS 内核 —— 「可见性」构建
#
# 目的：不改任何驱动（camera / audio / GPU 全部保留原样），只让内核的
#       printk 能显示在 6T 屏幕上，从而看到启动到底死在哪一步。
#
# 为什么之前的「内核太大」结论不可靠：
#   * ABL 收到的是 gzip 内核，它不解压，看不到 Image 头里的 image_size；
#   * 原厂 kernel+ramdisk = 27.47 MiB，本内核 16.03 MiB，按总量比本内核更小；
#   * 每次测试前都执行了 `fastboot set_active a`，该命令会把
#     slot-retry-count 重置为 7，所以「计数恒为 7」不能证明 ABL 没启动内核。
#   真正缺的是日志：`CONFIG_FRAMEBUFFER_CONSOLE` 未开，又没有 UART。
#
# 本构建只做三处配置改动（体积代价约 150–250 KiB）：
#   + CONFIG_FRAMEBUFFER_CONSOLE=y          内核日志画到 DRM fbdev 上
#   + CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
#   + CONFIG_PANIC_TIMEOUT=0                panic 后不重启，把最后信息留在屏幕
#   另外关掉 MODULE_SIG（与官方一致，仅影响模块签名，不影响功能）。
#
# 依赖已确认齐全（来自已编译内核的 IKCONFIG）：
#   CONFIG_VT=y / CONFIG_VT_CONSOLE=y / CONFIG_FB=y / CONFIG_DRM_FBDEV_EMULATION=y
#   CONFIG_BACKLIGHT_CLASS_DEVICE=y，且 6T 面板用 bl_ctrl_dcs（DSI 控亮度），
#   不依赖独立 WLED 背光芯片。
#
# 产物：Image.gz-dtb + dtb + kernel.config + 构建后配置核对，
#       打包 boot.img / 刷机仍在本地 op6t-agnos 脚本包完成。

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'agnos-kernel-sdm845 分支'
        required: false
        default: 'master'
      jobs:
        description: 'make -j'
        required: false
        default: '4'

permissions:
  contents: read

env:
  KERNEL_REPO: 'https://github.com/commaai/agnos-kernel-sdm845.git'
  DEFCONFIG: 'fajita_defconfig'
  DT_NAME: 'sdm845-oneplus6t'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout (this repo, 含 dts/defconfig)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu device-tree-compiler \
            python3 python3-pip cpio rsync xz-utils \
            gcc libc6-dev make
          # Linux 4.9 的 scripts/ 硬引用 python2（ubuntu-24.04 已移除），软链到 python3
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2
          aarch64-linux-gnu-gcc --version | head -1
          dtc --version

      - name: Fetch kernel source (shallow)
        run: |
          REF="${{ inputs.kernel_ref || 'master' }}"
          git clone --depth 1 --single-branch --branch "$REF" "$KERNEL_REPO" kernel
          cd kernel
          echo "kernel commit: $(git rev-parse HEAD)"

      - name: Install 6T board support
        run: |
          set -euo pipefail
          cp "dts/${DT_NAME}.dts" kernel/arch/arm64/boot/dts/qcom/
          DTS_MAKE=kernel/arch/arm64/boot/dts/qcom/Makefile
          if ! grep -q "${DT_NAME}.dtb" "$DTS_MAKE"; then
            echo "dtb-\$(CONFIG_ARCH_QCOM) += ${DT_NAME}.dtb" >> "$DTS_MAKE"
          fi
          cp "defconfig/${DEFCONFIG}" kernel/arch/arm64/configs/
          sed -i 's|^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES=.*|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES="qcom/sdm845-oneplus6t"|' \
            "kernel/arch/arm64/configs/${DEFCONFIG}"
          grep APPENDED "kernel/arch/arm64/configs/${DEFCONFIG}"

      - name: Patch py2 scripts for py3
        run: |
          set -euo pipefail
          cd kernel
          python3 - <<'PYEOF'
          from pathlib import Path
          wrapper = r"""#!/usr/bin/env python3
          import os, subprocess, sys
          if os.environ.get("ALLOW_WERROR_SPAM"):
              sys.exit(subprocess.call(sys.argv[1:]))
          proc = subprocess.Popen(sys.argv[1:], stdout=subprocess.PIPE,
                                  stderr=subprocess.PIPE, universal_newlines=True)
          out, err = proc.communicate()
          sys.stdout.write(out); sys.stderr.write(err)
          sys.exit(proc.returncode)
          """
          Path("scripts/gcc-wrapper.py").write_text(wrapper)
          Path("scripts/gcc-wrapper.py").chmod(0o755)
          PYEOF
          python3 -m py_compile scripts/gcc-wrapper.py && echo "gcc-wrapper.py OK"

      - name: Verify Qualcomm clk headers (never overwrite)
        run: |
          set -euo pipefail
          cd kernel
          # ★ 2026-11-08 教训：此前本 workflow 用 `cat > include/linux/clk/msm-clk.h`
          #   覆盖了这个头，抹掉了 CLKFLAG_* 宏，导致
          #     camera_v2/isp/msm_isp48.c: CLKFLAG_NORETAIN_MEM undeclared
          #   这棵树本身就带**完整**的 msm-clk.h（含全部 CLKFLAG_*），必须原样保留。
          #   另外 CONFIG_MSM_CPP 未开启，msm_cpp_soc.c 根本不参与编译，
          #   所以既不需要、也绝不能改写这个头。
          test -f include/linux/clk/msm-clk.h || {
            echo "缺少 include/linux/clk/msm-clk.h —— camera_v2 无法编译"; exit 1; }
          for f in CLKFLAG_NORETAIN_MEM CLKFLAG_NORETAIN_PERIPH \
                   CLKFLAG_RETAIN_MEM CLKFLAG_SKIP_HANDOFF; do
            grep -q "$f" include/linux/clk/msm-clk.h || {
              echo "msm-clk.h 缺少 $f"; exit 1; }
          done
          echo "msm-clk.h 完整，CLKFLAG_* 齐全（未被改写）"
          grep -nE 'CLKFLAG_(NORETAIN|RETAIN)_(MEM|PERIPH)' include/linux/clk/msm-clk.h

      - name: Configure (base defconfig, 功能不减)
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          make O=out "$DEFCONFIG" 2>&1 | tail -15

      - name: Enable on-screen console (only visibility change)
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          SC="scripts/config --file out/.config"
          # 只开可见性，不动 camera / audio / GPU
          $SC -e FRAMEBUFFER_CONSOLE \
              -e FRAMEBUFFER_CONSOLE_DETECT_PRIMARY \
              -e FRAMEBUFFER_CONSOLE_ROTATION || true
          # VT 相关若被依赖隐藏，一并打开
          $SC -e VT -e VT_CONSOLE -e FB -e DRM_FBDEV_EMULATION || true
          # panic 后不自动重启，把最后的信息留在屏幕上（排查用；正常启动不受影响）
          $SC --set-val PANIC_TIMEOUT 0 || true
          # 不签模块（与官方 build_kernel.sh 一致）
          $SC -d MODULE_SIG -d MODULE_SIG_ALL -d MODULE_SIG_FORCE \
              -d SYSTEM_TRUSTED_KEYS -d SYSTEM_REVOCATION_KEYS || true
          make O=out olddefconfig
          echo "=== 可见性配置核对（应为 y）==="
          grep -E "^CONFIG_(FRAMEBUFFER_CONSOLE|FRAMEBUFFER_CONSOLE_DETECT_PRIMARY|VT|VT_CONSOLE|FB|DRM_FBDEV_EMULATION)=" out/.config || true
          echo "=== panic 超时（应为 0）==="
          grep -E "^CONFIG_PANIC_TIMEOUT=" out/.config || true
          echo "=== 功能配置核对（必须保持开启）==="
          grep -E "^CONFIG_(MSMB_CAMERA|MSM_CAMERA_SENSOR|SND_SOC|SND_SOC_WCD934X|SND_SOC_WSA881X|QCOM_KGSL)=" out/.config || true

      - name: Build dtb first (fail fast)
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-w" WERROR=0
          make O=out -j"${{ inputs.jobs || '4' }}" "qcom/${DT_NAME}.dtb" 2>&1 | tail -20
          file out/arch/arm64/boot/dts/qcom/${DT_NAME}.dtb

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-w" WERROR=0
          set -o pipefail
          make O=out -j"${{ inputs.jobs || '4' }}" Image.gz-dtb > /tmp/kbuild.log 2>&1 || {
            rc=$?
            echo "=== BUILD FAILED rc=$rc ==="
            grep -nE 'error:|\*\*\*|No rule|undefined reference|fatal' /tmp/kbuild.log | tail -30
            tail -30 /tmp/kbuild.log
            exit $rc
          }
          tail -20 /tmp/kbuild.log

      - name: Report kernel size
        run: |
          set -uo pipefail
          K=kernel/out/arch/arm64/boot
          mkdir -p dist
          report() {
            local f="$1"; [ -f "$f" ] || return 0
            printf '%-14s %10s bytes  (%6.2f MiB)\n' \
              "$(basename "$f")" "$(stat -c%s "$f")" \
              "$(echo "scale=4; $(stat -c%s "$f") / 1048576" | bc)"
          }
          echo "=== 内核尺寸（仅供对照，不是判据）"
          echo "    原厂: 压缩 12.33 MiB / image_size 34.55 MiB"
          echo "    TWRP: 压缩 13.37 MiB / image_size 37.13 MiB"
          report "$K/Image"
          report "$K/Image.gz"
          report "$K/Image.gz-dtb"
          cp "$K/Image.gz" dist/ 2>/dev/null || true

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          K=kernel/out/arch/arm64/boot
          for f in Image Image.gz Image-dtb Image.gz-dtb; do
            [ -f "$K/$f" ] && cp "$K/$f" dist/ || true
          done
          [ -f "$K/dts/qcom/${DT_NAME}.dtb" ] && cp "$K/dts/qcom/${DT_NAME}.dtb" dist/
          cp kernel/out/.config dist/kernel.config 2>/dev/null || true
          # 相机/音频/GPU 关键符号必须在，确认没有被裁掉
          if [ -f kernel/out/vmlinux ]; then
            aarch64-linux-gnu-nm kernel/out/vmlinux 2>/dev/null \
              | grep -iE "msm_camera|imx519|imx376|imx371|wcd934x|wsa881|kgsl|mdss|dsi_display" \
              > dist/kernel-symbols.txt || true
            echo "关键符号行数: $(wc -l < dist/kernel-symbols.txt)"
          fi
          ls -lh dist/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 6T-kernel-console-${{ inputs.kernel_ref || 'master' }}
          path: dist
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            kernel/out/.config
            /tmp/kbuild.log
          if-no-files-found: ignore
          retention-days: 7